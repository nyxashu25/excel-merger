    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity="0.035"/>
  </pattern>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="1199" height="299" rx="14"/></clipPath>
</defs><g clip-path="url(#clip)"><rect width="1200" height="300" fill="#0d1117"/><rect width="1200" height="300" fill="url(#grid)"/><rect width="1200" height="300" fill="url(#glow)"/></g><rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="#0d1117" stroke="#30363d"/><path d="M0.5 40 V14.5 a14 14 0 0 1 14 -14 H1185.5 a14 14 0 0 1 14 14 V40 Z" fill="#161b22" stroke="#30363d"/><line x1="0.5" y1="40" x2="1199.5" y2="40" stroke="#30363d"/><circle cx="26" cy="20.0" r="6" fill="#ff5f56"/><circle cx="46" cy="20.0" r="6" fill="#ffbd2e"/><circle cx="66" cy="20.0" r="6" fill="#27c93f"/><text x="600.0" y="25.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" fill="#8b949e" text-anchor="middle" >excel-merger — python cli</text><text x="56" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="54" font-weight="bold" fill="#e6edf3" text-anchor="start" >excel-merger</text><text x="56" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="23" font-weight="normal" fill="#22d3ee" text-anchor="start" >Merge Excel and CSV files into one</text><text x="56" y="202" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="normal" fill="#8b949e" text-anchor="start" >Aligns columns by header name. Streams large files. Safe by default.</text><rect x="56" y="232" width="101" height="26" rx="13.0" fill="#1c2230" stroke="#30363d"/><text x="106.5" y="249.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="middle" >Python 3.9+</text><rect x="165" y="232" width="80" height="26" rx="13.0" fill="#1c2230" stroke="#30363d"/><text x="205.0" y="249.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="middle" >openpyxl</text><rect x="253" y="232" width="116" height="26" rx="13.0" fill="#1c2230" stroke="#30363d"/><text x="311.0" y="249.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="middle" >CLI + library</text><rect x="377" y="232" width="108" height="26" rx="13.0" fill="#1c2230" stroke="#30363d"/><text x="431.0" y="249.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="middle" >.xlsx · .csv</text><rect x="620" y="64" width="524" height="216" rx="10" fill="#161b22" stroke="#30363d"/><text x="642" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">excel-merger reports/ -o merged.xlsx</tspan></text><text x="642" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">  + </tspan><tspan fill="#8b949e">jan.xlsx [Sales]  1,204 rows</tspan></text><text x="642" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">  + </tspan><tspan fill="#8b949e">feb.xlsx [Sales]  1,377 rows</tspan></text><text x="642" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">  + </tspan><tspan fill="#8b949e">mar.xlsx [Sales]  1,512 rows</tspan></text><text x="642" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#e6edf3">Merged 3 file(s), 3 sheet(s): </tspan><tspan fill="#3fb950">4,093 rows, 9 columns</tspan></text><text x="642" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve"><tspan fill="#8b949e">Wrote merged.xlsx</tspan></text></svg>
